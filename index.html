<script>
const animes=[
 {title:"Attack on Titan",tmdb:"1429",desc:"Anime de aÃ§Ã£o e fantasia.",cats:["popular","action"],seasons:[{n:1,eps:25},{n:2,eps:12},{n:3,eps:22},{n:4,eps:30}]},
 {title:"Demon Slayer",tmdb:"85937",desc:"Aventura, aÃ§Ã£o e fantasia.",cats:["popular","action","fantasy"],seasons:[{n:1,eps:26},{n:2,eps:18},{n:3,eps:11},{n:4,eps:8}]},
 {title:"Jujutsu Kaisen",tmdb:"95479",desc:"AÃ§Ã£o e sobrenatural.",cats:["popular","action"],seasons:[{n:1,eps:24},{n:2,eps:23}]},
 {title:"One Piece",tmdb:"37854",desc:"Aventura e aÃ§Ã£o.",cats:["popular","action"],seasons:[{n:1,eps:20}]},
 {title:"Black Clover",tmdb:"73223",desc:"Fantasia e aÃ§Ã£o.",cats:["action","fantasy"],seasons:[{n:1,eps:170}]},

 {title:"My Hero Academia",tmdb:"65930",desc:"HerÃ³is e aÃ§Ã£o.",cats:["popular","action"],seasons:[{n:1,eps:13},{n:2,eps:25}]},
 {title:"Dr. STONE",tmdb:"86031",desc:"Aventura e ficÃ§Ã£o cientÃ­fica.",cats:["action","fantasy"],seasons:[{n:1,eps:24},{n:2,eps:11}]}
];

let current=animes;

function render(list){
 const g=document.getElementById("grid");g.innerHTML="";
 list.forEach(a=>{
  const c=document.createElement("article");c.className="card";
  c.innerHTML=`<div class="poster"><div><strong>${esc(a.title)}</strong><span>ðŸ‡§ðŸ‡· DUBLADO</span></div></div><div class="info"><div class="title">${esc(a.title)}</div><div class="meta">Anime â€¢ PT-BR</div></div>`;
  c.onclick=()=>openAnime(a);g.appendChild(c);
 });
}
function openAnime(a){
 document.getElementById("name").textContent=a.title;
 document.getElementById("desc").textContent=a.desc+" Player incorporado via VidRift.";
 let e=document.getElementById("episodes");e.innerHTML="";
 a.seasons.forEach(s=>{
  const h=document.createElement("div");h.style.gridColumn="1/-1";h.style.marginTop="10px";h.innerHTML=`<b>Temporada ${s.n}</b>`;e.appendChild(h);
  for(let ep=1;ep<=s.eps;ep++){
   const b=document.createElement("button");b.className="ep";b.textContent="EP "+String(ep).padStart(2,"0");b.onclick=()=>play(a,s.n,ep);e.appendChild(b);
  }
 });
 document.getElementById("modal").classList.add("open");
 play(a,a.seasons[0].n,1);
}
function play(a,season,episode){
 const url=`https://embed.vidrift.net/embed/tv/${a.tmdb}/${season}/${episode}`;
 document.getElementById("player").innerHTML=`<iframe src="${url}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
}
function closeModal(){document.getElementById("modal").classList.remove("open");document.getElementById("player").innerHTML=""}
function filter(cat){current=cat==="all"?animes:animes.filter(a=>a.cats.includes(cat));render(current)}
function search(e){e.preventDefault();let q=document.getElementById("q").value.toLowerCase();render(animes.filter(a=>a.title.toLowerCase().includes(q)))}
function scrollTop(){window.scrollTo({top:0,behavior:"smooth"})}
function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
render(animes);
</script>
